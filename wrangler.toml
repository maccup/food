name = "food"
compatibility_date = "2026-08-01"
pages_build_output_dir = "./public"

# Uwaga: konfiguracja Pages NIE przyjmuje account_id, wiec konto "Private"
# podaja skrypty w package.json przez CLOUDFLARE_ACCOUNT_ID. Na tym profilu
# wrangler widzi dwa konta i bez tego nic nie ruszy nieinteraktywnie.

[[d1_databases]]
binding = "DB"
database_name = "food"
database_id = "3cb98a94-de79-47a1-a29b-52c559143d68"
remote = true

[vars]
# PASSWORD ustawiany przez `wrangler pages secret put PASSWORD` albo .dev.vars
