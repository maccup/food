name: HealthSync
options:
  bundleIdPrefix: com.maciejcupial
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  HealthSync:
    type: application
    platform: iOS
    sources:
      - path: HealthSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maciejcupial.healthsync
        PRODUCT_NAME: HealthSync
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: HealthSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthSync/HealthSync.entitlements
        # Zespol ustawiany w Xcode, nie tutaj: identyfikator zespolu to dana
        # z konta Apple i nie ma powodu trzymac go w repo.
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - sdk: HealthKit.framework
