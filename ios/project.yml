name: Zdrowie
options:
  bundleIdPrefix: eu.cupial
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Zdrowie:
    type: application
    platform: iOS
    sources:
      - path: Zdrowie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.cupial.zdrowie
        PRODUCT_NAME: Zdrowie
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Zdrowie/Info.plist
        CODE_SIGN_ENTITLEMENTS: Zdrowie/Zdrowie.entitlements
        # Zespol ustawiany w Xcode, nie tutaj: identyfikator zespolu to dana
        # z konta Apple i nie ma powodu trzymac go w repo.
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - sdk: HealthKit.framework
